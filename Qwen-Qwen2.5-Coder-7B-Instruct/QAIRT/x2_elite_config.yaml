model_id_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
backend: HTP
soc_details: "chipset:SC8480XP"

enable_cache: true
enable_observers: true
show_progress: true

evaluation_mode: true
evaluator_config:
  context_length: 4096
  metrics:
    - name: PPL
      dataset_name: wikitext
      max_batches: 60

log_level: info

generator_config:
  sequence_length: 2073
  context_length: 16384

stages:
  model_loader:
    model_reauthoring: true
    execution_environment: gpu
    apply_default_adaptations: true

    hf_tokenizer_kwargs:
      trust_remote_code: true

    hf_pretrained_kwargs:
      dtype: float32
      device_map: auto
      attn_implementation: eager

    model_config_overrides:
      input_tokens_per_inference: 2073
      transposed_key_cache: true
      num_logits_to_keep: 0
      return_new_key_value_only: true

  quantization:
    recipe_name: lpbq_seqmse
    filename_prefix: Qwen2.5-7B_coder_inst
    technique_kwargs:
      seqmse:
        num_batches: 20
        num_candidates: 20
        block_size: 2048
      lpbq:
        quantsim_kwargs:
          default_param_bw: 4
          default_output_bw: 16
        module_precisions:
          rms_norm:
            weight_precision: int16
            mode: asymmetric
          embedding:
            weight_precision: int8
            mode: asymmetric
          lm_head:
            weight_precision: int8
          kv_cache:
            activation_precision: int8
            mode: symmetric
            match_info: [v_proj]
          custom:
            ".*self_attn_Concat_1":
              activation_precision: int8
              mode: symmetric

  genai_builder:
    native_kv: True
    weight_sharing: true
    prepare_embedding_lut: false
    transform_options:
      arn: [32, 128]
      context_length: [512, 1024, 2048, 3072, 4096, 8192, 16384]
      split.split_embedding: true
      split.split_lm_head: true
    calibration_options:
      act_precision: 16
      bias_precision: 32
    compile_options:
      graphs.hvx_threads: 8
      graphs.vtcm_size_in_mb: 8
      graphs.optimization_type: 3
      devices.cores.perf_profile: burst
      context.extended_udma: true
